# Research pipeline: searches arXiv for topics with configurable ranking criteria
# (relevance, submittedDate, lastUpdatedDate) and optional date filter, downloads PDFs
# into the Unity Catalog Volume, enriches metadata and builds a separate citation graph.
# Job-level `parameters` expose editable fields directly in the Databricks Jobs UI.
resources:
  jobs:
    ingest_papers:
      name: job-autograph-pipeline
      budget_policy_id: "891ab3b2-3b04-3ccb-8359-9327a16ef424"
      max_concurrent_runs: 1
      parameters:
        - name: env
          default: ${bundle.target}
        - name: topic
          default: "neuroscience, peririnal cortex"
        - name: num_papers
          default: "10"
        - name: ranking_criteria
          default: "relevance"
        - name: criteria_date
          default: ""
        - name: categories
          default: ""
        - name: run_id
          default: ""
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: ingest_papers
          environment_key: default
          notebook_task:
            notebook_path: deployment_notebooks/ingest_papers.py
            base_parameters:
              env: "{{job.parameters.env}}"
              topic: "{{job.parameters.topic}}"
              num_papers: "{{job.parameters.num_papers}}"
              ranking_criteria: "{{job.parameters.ranking_criteria}}"
              criteria_date: "{{job.parameters.criteria_date}}"
              categories: "{{job.parameters.categories}}"
              run_id: "{{job.parameters.run_id}}"
        - task_key: enrich_bibliography
          depends_on:
            - task_key: ingest_papers
          environment_key: default
          notebook_task:
            notebook_path: deployment_notebooks/enrich_bibliography.py
            base_parameters:
              env: "{{job.parameters.env}}"
              run_id: "{{tasks.ingest_papers.values.run_id}}"
        - task_key: build_graph
          depends_on:
            - task_key: enrich_bibliography
          environment_key: default
          notebook_task:
            notebook_path: deployment_notebooks/build_graph.py
            base_parameters:
              env: "{{job.parameters.env}}"
              run_id: "{{tasks.ingest_papers.values.run_id}}"
              bibliography_snapshot_id: "{{tasks.enrich_bibliography.values.bibliography_snapshot_id}}"
