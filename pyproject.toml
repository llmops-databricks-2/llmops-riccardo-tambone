[project]
name = "arxiv-curator"
dynamic = ["version"]
description = "Arxiv Curator - Shared utilities for LLMOps Course on Databricks"
requires-python = "==3.12.*"
dependencies = [
    "cffi==1.17.1",
    "cloudpickle==3.0.0",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "pyarrow==21.0.0",
    "databricks-sdk==0.118.0",
    "pydantic==2.10.6",
    "loguru==0.7.3",
    "python-dotenv==1.2.1",
    "databricks-vectorsearch==0.63",
    "openai==2.14.0",
    "databricks-mcp==0.4.0",
    "backoff==2.2.1",
    "mlflow==3.16.1",
    "nest-asyncio==1.6.0",
    "arxiv==2.3.1",
    "databricks-agents==1.12.0",
    "psycopg==3.3.2",
    "psycopg-pool==3.3.0",
    "psycopg[binary]==3.3.2"
]

[project.optional-dependencies]
dev = ["pre-commit>=4.1.0, <5"]

ci = ["pre-commit>=4.1.0, <5",
      "pytest>=8.3.4, <9"]

[build-system]
requires = ["setuptools>=72.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where =["src"]
include = ["arxiv_curator*"]

[tool.setuptools.dynamic]
version = { file = "version.txt" }

[tool.pytest.ini_options]
addopts = "-s --no-header --no-summary"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
lint.select = [
    "F",    # pyflakes rules
    "E",    # pycodestyle error rules
    "W",    # pycodestyle warning rules
    "B",    # flake8-bugbear rules
    "I",    # isort rules
    "UP",   # pyupgrade rules
    "SIM",  # flake8-simplify rules
    "ERA",  # eradicate rules
    "C",    # pylint convention rules
    "D",    # pydocstyle rules
    "ANN"   # flake8-annotations rules
]
lint.ignore = [
    "D107", # Missing docstring in `__init__`
    "D203", # incorrect-blank-line-before-class
    "D213", # multi-line-summary-second-line
    "E501", # line-too-long
    "C901", # too complex
]

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true

[dependency-groups]
dev = [
    "databricks-connect~=18.0.0",
]

[tool.databricks.environment]
environment_version = "6"
