# Project configuration for the LLMOps course, filled in for you at onboarding.
# Resources are provisioned at onboarding except the volume, which you create during the course.
# embedding_endpoint is the serving endpoint for ai_query, AI Search and DatabricksServingEndpoint;
# embedding_service is the AI Gateway model service for the OpenAI client (README.md).

# Your usage policy: set it on every serverless job, endpoint and app you create.
usage_policy_id: "891ab3b2-3b04-3ccb-8359-9327a16ef424"

# One existing Lakebase project/compute, separate PostgreSQL schemas per environment.
# lakebase_endpoint may optionally pin its full projects/.../branches/.../endpoints/... resource.

# Development: your own schema in the dev catalog, which you manage and work in.
dev:
  catalog: "llmops_dev"
  schema: "riccardo_tambone"
  volume: "arxiv_files"
  llm_endpoint: "course_ops.gateway.chat"
  embedding_endpoint: "databricks-gte-large-en"
  embedding_service: "course_ops.gateway.embed"
  # Bump revision whenever the Gateway's embedding model/routing changes.
  embedding_revision: "v1"
  lakebase_host: "ep-wild-lake-d8jyu0vq.database.us-east-2.cloud.databricks.com"
  lakebase_database: "databricks_postgres"
  lakebase_schema: "autographrs_dev"
  warehouse_id: "cbb5a7d4b7979574"
  experiment_path: "/llmops/riccardo-tambone-dev"
  # Your provisioned Lakebase project.
  lakebase_instance: "lb-llmops-riccardo-tambone"

# Acceptance: your schema in the acceptance catalog, written by your deploys; you read it.
acc:
  catalog: "llmops_acc"
  schema: "riccardo_tambone"
  volume: "arxiv_files"
  llm_endpoint: "course_ops.gateway.chat"
  embedding_endpoint: "databricks-gte-large-en"
  embedding_service: "course_ops.gateway.embed"
  embedding_revision: "v1"
  lakebase_host: "ep-wild-lake-d8jyu0vq.database.us-east-2.cloud.databricks.com"
  lakebase_database: "databricks_postgres"
  lakebase_schema: "autographrs_acc"
  warehouse_id: "cbb5a7d4b7979574"
  experiment_path: "/llmops/riccardo-tambone-acc"
  # Your provisioned Lakebase project for this environment.
  lakebase_instance: "lb-llmops-riccardo-tambone"

# Production: your schema in the production catalog, written by your deploys; you read it.
prd:
  catalog: "llmops_prd"
  schema: "riccardo_tambone"
  volume: "arxiv_files"
  llm_endpoint: "course_ops.gateway.chat"
  embedding_endpoint: "databricks-gte-large-en"
  embedding_service: "course_ops.gateway.embed"
  embedding_revision: "v1"
  lakebase_host: "ep-wild-lake-d8jyu0vq.database.us-east-2.cloud.databricks.com"
  lakebase_database: "databricks_postgres"
